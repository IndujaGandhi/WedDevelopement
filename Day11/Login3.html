<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        .h1s{
            text-align: center;
            color: blue;
        }
        .h1l{
            text-align: center;
            color: green;
        }
        .signsection{
            text-align: center;
            margin-top: 50px;
            border: 1px solid black;
            padding: 20px;
        }


    </style>
</head>
<body>
    <h1 class="h1s">SignIn Page</h1>
    <div class="signsection">
        <form >
            <label for="Username">Username:</label>
            <input type="text" id="username" required><br><br>
            <label for="email">Email: </label>
            <input type="email" id="email" required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" required><br><br>         
        </form>
    </div>
    <h1 class="h1l">Login Page</h1>
    <div class="Loginsection">
        <form>
            <label for="username">Username:</label>
            <input type="text" id="usernamelog" required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="passwordlog" required><br><br>
            <button type="submit" onclick="login()">Login</button>
        </form>
    </div>
    <script>
        const userreg = document.getElementById('username').value;
        const passreg = document.getElementById('password').value;

        const passlog = document.getElementById('passwordlog').value;
        const userlog = document.getElementById('usernamelog').value;
        function login(){
            if(userreg===userlog && passreg===passlog)
            {
                alert("Login successful!");
            }
            else
            {
                alert("Invalid username or password.");
            }
        }
    </script>
</body>
</html>
